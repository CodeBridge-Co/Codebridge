android {
    // ... existing config ...
    buildFeatures {
        buildConfig true
    }
}

dependencies {
    // Retrofit 2
    implementation 'com.squareup.retrofit2:retrofit:2.9.0'
    implementation 'com.squareup.retrofit2:converter-gson:2.9.0'

    // OkHttp 4 (Blueprint mentions OkHttp 3, 4.12.0 is the modern equivalent)
    implementation 'com.squareup.okhttp3:okhttp:4.12.0'
    implementation 'com.squareup.okhttp3:logging-interceptor:4.12.0'

    // WorkManager (this is for sync retries)
    implementation 'androidx.work:work-runtime:2.9.0'

    // Lifecycle (this is for LiveData in NetworkMonitor)
    implementation 'androidx.lifecycle:lifecycle-livedata:2.7.0'

    // Testing
    testImplementation 'junit:junit:4.13.2'
    testImplementation 'com.squareup.okhttp3:mockwebserver:4.12.0'

    //  to support the new security and database features
   
    // Room (for database)
    implementation 'androidx.room:room-runtime:2.6.1'
    annotationProcessor 'androidx.room:room-compiler:2.6.1'

    // SQLCipher (for encrypted Room database)
    implementation 'net.zetetic:android-database-sqlcipher:4.5.4'
    implementation 'androidx.sqlite:sqlite-ktx:2.4.0'

    // EncryptedSharedPreferences
    implementation 'androidx.security:security-crypto:1.1.0-alpha06'

    // WorkManager (for sync retries)
    implementation 'androidx.work:work-runtime:2.9.0'
}

defaulConfig {
buildConfigField "String", "BASE_URL", "\"http://10.0.2.2:8000/\""
}
