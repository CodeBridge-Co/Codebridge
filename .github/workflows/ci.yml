name: CodeBridge CI

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]

jobs:
  android-test:
    name: Android Unit Tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Grant execute permission for gradlew
        run: chmod +x android-app/gradlew

      - name: Run Android Unit Tests
        run: cd android-app && ./gradlew test --no-daemon

  backend-test:
    name: Backend Unit Tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./backend
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest httpx

      - name: Run pytest
        run: pytest -v --tb=short || [ $? -eq 5 ]

  docker-build:
    name: Build Docker Image
    runs-on: ubuntu-latest
    needs: [backend-test]
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Build Docker image
        run: docker build -t codebridge-backend:latest ./backend

  integration-test:
    name: Integration Test (Postgres + Backend)
    runs-on: ubuntu-latest
    needs: [backend-test]
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Start full stack
        run: |
          cd infra
          docker compose up -d --build

      - name: Wait for backend health
        run: |
          for i in $(seq 1 60); do
            if curl -sf http://localhost:8000/health >/dev/null 2>&1; then
              echo "Backend healthy after ${i}s"
              break
            fi
            if [ "$i" -eq 60 ]; then
              echo "::error::Backend did not become healthy in 60s"
              docker compose -f infra/docker-compose.yml logs backend
              exit 1
            fi
            sleep 1
          done

      - name: Verify endpoints return JSON
        run: |
          curl -f http://localhost:8000/health
          curl -f http://localhost:8000/problems
          curl -f http://localhost:8000/leaderboard
          curl -f http://localhost:8000/events

      - name: Tear down
        if: always()
        run: |
          cd infra
          docker compose down -v
