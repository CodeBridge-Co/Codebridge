version: '3.8'

services:
  postgres:
    image: postgres:15-alpine
    container_name: codebridge_postgres
    restart: always
    env_file:
      - env/postgres.env
    volumes:
      - ./postgres/init:/docker-entrypoint-initdb.d
      - pgdata:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U codebridge_user -d codebridge_db"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build: ../backend
    container_name: codebridge_backend
    command: uvicorn main:app --host 0.0.0.0 --port 8000 --reload
    env_file:
      - env/backend.env
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy

  pgadmin:
    image: dpage/pgadmin4
    container_name: codebridge_pgadmin
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@codebridge.com
      PGADMIN_DEFAULT_PASSWORD: wewillchangeit
    ports:
      - "8080:80"
    depends_on:
      - postgres

volumes:
  pgdata:
